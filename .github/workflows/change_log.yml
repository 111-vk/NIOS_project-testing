name: Update Changelog

on:
  push:
    branches:
      - main # Change to your default branch if different

permissions:
  contents: write # Required to commit and push changes

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate previous state

      - name: Get latest commit message and details
        id: commit
        run: |
          MESSAGE=$(git log -1 --pretty=%B | sed 's/"/\\"/g')  # Escape quotes if needed
          DATE=$(git log -1 --pretty=%F)
          SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)

          echo "message=$MESSAGE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Prepend entry to CHANGELOG.md
        run: |
          ENTRY="### ${{ steps.commit.outputs.date }} (${{ steps.commit.outputs.author }} - ${{ steps.commit.outputs.sha }})\n\n- ${{ steps.commit.outputs.message }}\n\n$(cat CHANGELOG.md 2>/dev/null || echo '')"

          echo "$ENTRY" > CHANGELOG.md

      - name: Commit and push updated CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md with latest commit [skip ci]"
          file_pattern: CHANGELOG.md
          branch: ${{ github.ref_name }}
