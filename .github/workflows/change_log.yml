name: Generate Changelog Entry with Gemini

on:
  push:
    branches:
      - main # Change to your default branch if different

permissions:
  contents: write # Required to push changes back to the repository

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for full git history if required later

      - name: Get latest commit message
        id: commit
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API to generate changelog entry
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COMMIT_MESSAGE="${{ steps.commit.outputs.message }}"
          PROMPT="You are a helpful assistant that generates concise, professional changelog entries in Markdown format based on git commit messages. Format the entry as:\n\n- **Category:** Brief description\n\nUse appropriate categories like Features, Bug Fixes, Improvements, Documentation, etc. If unsure, use Other Changes.\n\nCommit message:\n$COMMIT_MESSAGE"

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "'"$PROMPT"'"
                }]
              }]
            }')

          # Extract the generated text
          ENTRY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$ENTRY" ]; then
            echo "Error: No response from Gemini API"
            echo "$RESPONSE"
            exit 1
          fi

          echo "entry<<EOF" >> $GITHUB_OUTPUT
          echo "$ENTRY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          ENTRY="${{ steps.gemini.outputs.entry }}"
          DATE=$(date '+%Y-%m-%d')
          COMMIT_SHA=$(git rev-parse --short HEAD)

          NEW_ENTRY="## [$DATE] - Commit $COMMIT_SHA\n\n$ENTRY\n\n$(cat CHANGELOG.md 2>/dev/null || echo '')"

          echo "$NEW_ENTRY" > CHANGELOG.md

      - name: Commit and push updated CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md with latest changes [skip ci]"
          file_pattern: CHANGELOG.md
          branch: ${{ github.ref_name }}
